plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom' version "${loom_version}"
}

configurations {
    commonJava
    commonResources
}

version = "${mod_version}-${project.name}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

def commonDatagenOutput =
    rootProject.file('common/src/generated/resources').absolutePath

fabricApi {
    configureDataGeneration {
        outputDirectory = file('src/generated/resources')
        createRunConfiguration = true
    }
}

loom {
    runs {
        datagen {
            property(
                'dinnerware.datagen.commonOutput',
                commonDatagenOutput
            )
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Keep common and Fabric in the same Mojmap namespace.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    //include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    commonJava project(
        path: ':common',
        configuration: 'commonJava'
    )

    commonResources project(
        path: ':common',
        configuration: 'commonResources'
    )
}

sourceSets {
    main {
        java.srcDir configurations.commonJava

        resources {
            srcDir configurations.commonResources
            exclude '.cache/**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_description: mod_description,
                mod_license: mod_license,
                mod_authors: mod_authors,
                minecraft_version: minecraft_version,
                fabric_loader_version: fabric_loader_version
        )
    }
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        rename {
            "${it}_${mod_id}"
        }
    }
}

tasks.register('runData') {
    group = 'fabric'
    description = 'Runs Fabric data generation.'
    dependsOn tasks.named('runDatagen')
}